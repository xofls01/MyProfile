{{ define "main" }}
<div class="home-book">
    <div class="home-intro">
        <div class="home-profile">
            <section class="home-about" aria-labelledby="home-name">
                {{ with .Site.Params.AvatarURL }}
                <div class="avatar">
                    <img class="size-m" src="{{ $.Scratch.Get "avatarImgSrc" }}" alt="{{ $.Site.Params.AvatarAltText | default "프로필 사진" }}" width="168" height="224">
                </div>
                {{ end }}
                <h1 id="home-name">{{ .Site.Title }}</h1>
                {{ with .Site.Params.Description }}
                <p class="home-description">{{ . }}</p>
                {{ end }}
            </section>

        </div>
    </div>

    {{ with .Site.GetPage "/about" }}
    <div class="home-cover-stage">
        <a class="about-cover" href="{{ .RelPermalink }}" aria-label="About me 자기소개 페이지로 이동">
            <span class="about-cover-front">
                <span class="cover-index">01</span>
                <span class="cover-action">About me <span class="cover-arrow" aria-hidden="true">→</span></span>
            </span>
        </a>
    </div>
    {{ end }}
</div>
{{ with .Content }}
<section class="home-content">{{ . }}</section>
{{ end }}
{{ end }}
