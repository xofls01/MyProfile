{{ define "main" }}
<article class="about-page" aria-labelledby="about-title">
    <header class="about-page-header">
        <span class="about-page-number" aria-hidden="true">02 /</span>
        <h1 id="about-title">{{ .Title }}</h1>
    </header>
    <div class="about-content">
        {{ .Content }}
    </div>
    {{ if .Site.Params.ShowBackToTopButton }}
        {{ partial "back-to-top.html" . }}
    {{ end }}
</article>
{{ end }}
