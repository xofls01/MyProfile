{{ define "main" }}
<article class="about-page" aria-labelledby="about-title">
    <header class="about-page-header">
        <span class="about-page-number" aria-hidden="true">02 /</span>
        <h1 id="about-title">{{ .Title }}</h1>
    </header>
    <div class="about-content">
        {{ .Content }}
    </div>
    {{ with .Site.GetPage "/projects" }}
    <nav class="about-page-navigation" aria-label="다음 페이지">
        <a class="about-next-page" href="{{ .RelPermalink }}" data-page-turn aria-label="Projects 프로젝트 목록으로 이동">
            <span>Projects</span>
            <span class="about-next-arrow" aria-hidden="true">→</span>
        </a>
    </nav>
    {{ end }}
    {{ if .Site.Params.ShowBackToTopButton }}
        {{ partial "back-to-top.html" . }}
    {{ end }}
</article>
{{ end }}
