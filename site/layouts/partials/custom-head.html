{{ if .IsHome }}
  <link rel="stylesheet" href="{{ "css/home.css" | relURL }}">
{{ end }}

{{ if .Params.aboutstyle }}
  <link rel="stylesheet" href="{{ "css/about.css" | relURL }}">
{{ end }}

{{ with .Site.GetPage "/about" }}
  {{ if or $.IsHome (eq $.RelPermalink .RelPermalink) }}
    <link rel="stylesheet" href="{{ "css/page-turn.css" | relURL }}">
    <script src="{{ "js/home-cover.js" | relURL }}" data-home-url="{{ $.Site.Home.RelPermalink }}" data-about-url="{{ .RelPermalink }}"></script>
  {{ end }}
{{ end }}
