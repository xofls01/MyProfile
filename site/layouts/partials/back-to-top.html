<button type="button" id="btt-button" class="arrow-logo" aria-label="맨 위로 이동" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 384 512" aria-hidden="true" focusable="false">
        <path d="M177 159.7l136 136c9.4 9.4 9.4 24.6 0 33.9l-22.6 22.6c-9.4 9.4-24.6 9.4-33.9 0L160 255.9l-96.4 96.4c-9.4 9.4-24.6 9.4-33.9 0L7 329.7c-9.4-9.4-9.4-24.6 0-33.9l136-136c9.4-9.5 24.6-9.5 34-.1z"/>
    </svg>
</button>
<script>
    (() => {
        const button = document.getElementById('btt-button');
        const update = () => { button.hidden = window.scrollY <= 20; };
        window.addEventListener('scroll', update, { passive: true });
        window.addEventListener('pageshow', update);
        button.addEventListener('click', () => {
            document.getElementById('content').focus({ preventScroll: true });
            window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
        });
        update();
    })();
</script>
